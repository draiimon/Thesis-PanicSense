services:
  - type: web
    name: panicsense
    runtime: node
    region: oregon
    plan: free
    buildCommand: chmod +x ./scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: panicsense-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: panicsenseadmin
      - key: ADMIN_EMAIL
        value: admin@panicsense.ph
    autoDeploy: true

databases:
  - name: panicsense-db
    databaseName: panicsense
    plan: free
